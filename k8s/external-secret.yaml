apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: orders-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/orders-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/orders-microservice
        property: WAREHOUSE_SERVICE_TOKEN
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN

    - secretKey: FLIPFLOP_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/flipflop-service
        property: ORDERS_SERVICE_TOKEN
    - secretKey: ALLEGRO_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/allegro-service
        property: JWT_TOKEN
    - secretKey: CLIPLOT_ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/cliplot
        property: ORDERS_SERVICE_TOKEN
    - secretKey: INVOICES_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/invoices-microservice
        property: ORDERS_SERVICE_TOKEN
    # Ingest credential for posting credential self-reports to monitoring
    # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). Not a probe credential: it
    # authenticates the report, never the lane being reported on.
    #
    # NOTE the property name is PLURAL. monitoring's own ExternalSecret maps env
    # NOTIFICATION_SERVICE_TOKEN <- Vault NOTIFICATIONS_SERVICE_TOKEN, and
    # MonitoringIngestGuard compares against that running value. The singular key
    # also exists in monitoring's path with a different, stale value; using it
    # yields a token the guard rejects with 403 while the probe itself succeeds.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
