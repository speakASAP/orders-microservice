apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-microservice-config
  namespace: statex-apps
  labels:
    app: orders-microservice
    managed-by: k8s-migration
data:
  NODE_ENV: "production"
  SERVICE_NAME: "orders-microservice"
  DOMAIN: "orders.alfares.cz"
  PORT: "3203"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_USER: "dbadmin"
  DB_NAME: "orders"
  DB_SYNC: "false"
  DB_AUTO_CREATE: "true"
  LOG_LEVEL: "info"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  WAREHOUSE_SERVICE_URL: "http://warehouse-microservice.statex-apps.svc.cluster.local:3201"
  WAREHOUSE_RESERVATION_ENABLED: "true"
  WAREHOUSE_RESERVATION_TTL_MINUTES: "15"
  RABBITMQ_URL: "amqp://guest:guest@host.k3s.internal:5672"
