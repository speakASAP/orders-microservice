apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-microservice
  namespace: statex-apps
  labels:
    app: orders-microservice
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: orders-microservice
    spec:
      containers:
        - name: app
          image: localhost:5000/orders-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3203
              name: http
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: orders-microservice-config
            - secretRef:
                name: orders-microservice-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3203
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3203
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
